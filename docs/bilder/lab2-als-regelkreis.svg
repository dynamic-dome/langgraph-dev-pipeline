<svg xmlns="http://www.w3.org/2000/svg" id="rk-d" viewBox="0 0 1520 680" width="1520" height="680" role="img" aria-labelledby="d-titel d-text">
<title id="d-titel">Lab 2 als Regelkreis: die Fix-Schleife im LangGraph-Graphen</title>
<desc id="d-text">Lab 2 führt den inneren Regelkreis automatisch als LangGraph-Graph aus. Ich gebe Spec und Plan frei; ein eigener Agent schreibt daraus Akzeptanztests, die der Implementierer nie sieht. Ein Testlauf ohne Sprachmodell und vier parallele Prüfer messen den Stand. Der Befund-Filter löst nur bei roten Tests oder Befunden ab major mit Zitat eine Fix-Runde aus, in der Voreinstellung höchstens zwei. Ist die Grenze erreicht oder kommt derselbe Befund zweimal, entscheide ich. Ist nichts offen, folgen Gesamtreview, meine Abschluss-Freigabe und ein lokaler Merge; dieser Teil ist seit 13. November 2026 in Bau. Lab 2 arbeitet an einem Übungsrepo.</desc>
<style>
