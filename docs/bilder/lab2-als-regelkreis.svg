#rk-d .code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;fill:hsl(var(--gold-soft,42 50% 70%))}
#rk-d .kopf{font-size:17px;font-weight:600}
#rk-d .mitte{text-anchor:middle}
#rk-d .box{fill:hsl(var(--card,222 20% 7%));stroke:hsl(var(--muted-foreground,40 8% 62%));stroke-width:1.5}
#rk-d .ich{fill:hsl(42 65% 58% / 0.12);stroke:hsl(var(--gold,42 65% 58%));stroke-width:1.8}
#rk-d .mess{fill:hsl(188 95% 58% / 0.07);stroke:hsl(var(--neon-cyan,188 95% 58%));stroke-width:1.5}
#rk-d .bau{stroke-dasharray:7 5}
#rk-d .rahmen{fill:none;stroke:hsl(40 8% 62% / 0.45);stroke-width:1.2;stroke-dasharray:3 4}
#rk-d .ln{fill:none;stroke:hsl(var(--foreground,40 25% 92%));stroke-width:1.6}
#rk-d .lm{fill:none;stroke:hsl(var(--neon-cyan,188 95% 58%));stroke-width:1.6}
#rk-d .vgl{fill:hsl(var(--card,222 20% 7%));stroke:hsl(var(--foreground,40 25% 92%));stroke-width:1.6}
#rk-d .pfk{fill:hsl(var(--foreground,40 25% 92%))}
#rk-d .pfm{fill:hsl(var(--neon-cyan,188 95% 58%))}
